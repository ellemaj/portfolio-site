services:
  app:
    build: .
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DB: mysql
      VIEWS_PATH: app/views
      DB_HOST: db
      DB_NAME: maestro
      DB_USER: root
      DB_PASS: ${DOCKER_DB_PASSWORD:?set DOCKER_DB_PASSWORD in .env, see .env.example}

  tailwind:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install --silent && npm run dev"

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASSWORD:?set DOCKER_DB_PASSWORD in .env, see .env.example}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: maestro
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DOCKER_DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
