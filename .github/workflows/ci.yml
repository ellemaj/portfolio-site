name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=256M

  phpcs:
    name: PHPCS (PSR-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPCS
        run: vendor/bin/phpcs

  deptrac:
    name: Deptrac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run Deptrac
        run: vendor/bin/deptrac analyse --no-progress

  deploy:
    name: Deploy to Strato
    runs-on: ubuntu-latest
    needs: [phpstan, phpcs, deptrac]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build CSS
        run: npm ci && npm run build
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASS" "sftp://$SFTP_HOST" << 'LFTP'
          set sftp:auto-confirm yes
          set net:timeout 60
          mirror -R --delete \
            --exclude-glob .git \
            --exclude-glob .github \
            --exclude-glob tests \
            --exclude-glob node_modules \
            --exclude-glob resources \
            --exclude .env \
            --exclude .env.example \
            --exclude-glob "*.sqlite" \
            --exclude hash.php \
            . /
          quit
          LFTP
